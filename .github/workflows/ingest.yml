name: Atualizar dados e publicar site
on:
  schedule:
    - cron: "17 6 * * *"   # todo dia, 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: jobs/requirements.txt }
      - name: Testes e coleta de dados reais
        working-directory: jobs
        env: { FRED_API_KEY: "${{ secrets.FRED_API_KEY }}" }
        run: |
          pip install -r requirements.txt
          python -m pytest -q
          python -m kondratiev.validate || echo "Alguma série falhou na validação (veja acima)"
          python -m kondratiev.ingest || echo "Alguma fonte falhou (veja acima e no painel de qualidade)"
          mkdir -p ../web/data
          python -m kondratiev.export ../web/data/data.json
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Montar o site
        working-directory: web
        env: { BASE_PATH: "/${{ github.event.repository.name }}" }
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
