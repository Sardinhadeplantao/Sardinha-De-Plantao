name: Ingest data
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: jobs } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: jobs/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Validate series IDs against the real APIs
        env: { FRED_API_KEY: "${{ secrets.FRED_API_KEY }}" }
        run: python -m kondratiev.validate
      - name: Ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m kondratiev.ingest
